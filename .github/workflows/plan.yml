name: plan-consistency
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  planning-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate planning consistency only
        run: python3 scripts/plan.py validate
