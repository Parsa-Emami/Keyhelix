name: plan-consistency
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  planning-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate planning consistency only
        run: python3 scripts/plan.py validate
