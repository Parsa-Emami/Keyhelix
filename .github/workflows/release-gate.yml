name: release-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate roadmap plan and repository contracts
        run: |
          npm run validate:plan
          python3 scripts/validate_repo.py
          python3 scripts/plan.py validate

      - name: Enforce evidence-backed open-source v1 release gate
        run: npm run release:check

      - name: Run C39 Go engine release-gate and storage invariant tests
        run: go test -count=1 -v ./tests -run TestC39

      - name: Run Node release-gate contract and negative tests
        run: node --test tests/web/release-gate.test.mjs
