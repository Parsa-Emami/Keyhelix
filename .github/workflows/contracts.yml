name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Source integrity regressions
        run: python3 -m unittest discover -s tests/engineering -p 'test_*.py' -v
      - name: Verify historical records and this exact checkout
        run: python3 scripts/verify_ci_source.py
      - name: Upload this commit's complete source inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-integrity-${{ github.sha }}-${{ github.run_id }}
          path: dist/ci/source.json
          if-no-files-found: error
          retention-days: 14
